name: CI

on:
  push:
    branches: [main, database, frontend, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mzaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Test
        working-directory: backend
        env:
          NODE_ENV: test
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/mzaya_test
          JWT_SECRET: ci-secret-at-least-32-characters-long!!!
          ALLOW_MOCK_PAYMENTS: 'true'
        run: npm test
      - name: Release preflight
        working-directory: backend
        run: node scripts/release-gate.js
      - name: Pilot readiness static audit
        working-directory: backend
        run: node scripts/pilot-readiness-audit.js

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Brand asset check
        working-directory: frontend
        run: npm run brand:check
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Bundle size
        working-directory: frontend
        run: |
          echo "Built bundle:"
          du -sh dist
          SIZE=$(du -sk dist | cut -f1)
          echo "dist is ${SIZE}KB"
          if [ "$SIZE" -gt 3000 ]; then
            echo "::warning::Bundle is over 3MB — review mobile data impact."
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Frontend
        working-directory: frontend
        run: npm audit --audit-level=high
