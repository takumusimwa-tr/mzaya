name: One-time dependency security remediation

on:
  push:
    branches:
      - integration/consolidate-20261114
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  safe-lockfile-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/consolidate-20261114
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remediate backend lockfile without major-version forcing
        working-directory: backend
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --audit-level=high || true
      - name: Remediate frontend lockfile without major-version forcing
        working-directory: frontend
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --audit-level=high || true
      - name: Commit only dependency lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): apply nonbreaking npm audit lockfile updates"
            git push origin HEAD:integration/consolidate-20261114
          fi
