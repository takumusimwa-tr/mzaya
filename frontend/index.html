<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Zimbabwe's on-demand delivery platform" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mzaya" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicons/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicons/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/favicons/apple-touch-icon.png" />
    <title>Mzaya — Food, groceries & errands delivered</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the service worker in PRODUCTION ONLY.
      //
      // The SW caches JS/CSS cache-first. That's correct for a deployed app on a
      // patchy Zimbabwean connection — and actively harmful against Vite's dev
      // server, where it serves stale module bundles and you end up debugging
      // code that isn't the code on disk.
      //
      // In dev we also actively unregister any SW left over from a previous run.
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((r) => r.unregister())
          })
          if (window.caches) {
            caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)))
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(() => console.log('Mzaya SW registered'))
              .catch((err) => console.log('SW registration failed:', err))
          })
        }
      }
    </script>
  </body>
</html>
