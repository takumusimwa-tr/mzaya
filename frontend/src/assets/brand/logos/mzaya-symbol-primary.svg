<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Mzaya symbol</title>
<desc id="desc">A geometric M containing a running courier carrying a parcel.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34C76F"/>
    <stop offset="0.55" stop-color="#00A651"/>
    <stop offset="1" stop-color="#007D3D"/>
  </linearGradient>
</defs>
<rect width="512" height="512" rx="112" fill="url(#g)"/>
<!-- M frame -->
<path d="M96 384V120h76l84 111 84-111h76v264h-76V236l-84 106-84-106v148z" fill="#FFFFFF"/>
<!-- courier head -->
<circle cx="278" cy="184" r="22" fill="#007D3D"/>
<!-- courier body / limbs cut into M -->
<path d="M253 224c14-20 37-28 58-18l39 19-18 36-31-15-28 40 43 31-22 37-66-47 41-59-16 8-34 45-31-21 41-61c10-15 25-25 44-25z"
      fill="#007D3D"/>
<!-- parcel -->
<rect x="336" y="205" width="58" height="58" rx="8" fill="#FFFFFF" stroke="#007D3D" stroke-width="12"/>
<path d="M365 205v25l-10-7-10 7v-25" fill="#007D3D"/>
</svg>