<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title">
<title id="title">Food, groceries and more</title>

<defs>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071B33" flood-opacity=".12"/>
  </filter>
  <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34C76F"/>
    <stop offset="1" stop-color="#007D3D"/>
  </linearGradient>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DFF4FF"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
</defs>

<rect width="720" height="520" rx="36" fill="url(#skyGrad)"/>
<circle cx="590" cy="94" r="56" fill="#FFC107" opacity=".28"/>
<path d="M0 392c120-52 240-50 360 8s240 64 360 6v114H0z" fill="#E8F8EF"/>
<!-- shop -->
<g filter="url(#shadow)">
  <rect x="54" y="188" width="232" height="190" rx="22" fill="#FFFFFF"/>
  <rect x="54" y="188" width="232" height="46" rx="22" fill="#FFF8E7"/>
  <path d="M54 214h232" stroke="#E4E7EC" stroke-width="2"/>
  <path d="M72 188l24-34h148l24 34" fill="#FFC107" opacity=".85"/>
  <rect x="83" y="260" width="64" height="118" rx="8" fill="#E8F8EF"/>
  <rect x="170" y="260" width="88" height="74" rx="10" fill="#F7F8FA"/>
  <circle cx="190" cy="288" r="14" fill="#34C76F"/>
  <circle cx="226" cy="288" r="14" fill="#FFC107"/>
</g>
<!-- customer -->
<g transform="translate(288 132)">
  <circle cx="64" cy="58" r="34" fill="#C4865B"/>
  <path d="M31 57c3-36 55-49 75-17 7 11 8 25 3 39-18-12-48-12-78-22z" fill="#2C1A14"/>
  <rect x="28" y="96" width="78" height="122" rx="34" fill="#F3C56F"/>
  <path d="M45 111l19 26 20-26" stroke="#FFFFFF" stroke-width="8" fill="none"/>
  <rect x="84" y="126" width="82" height="12" rx="6" transform="rotate(-18 84 126)" fill="#C4865B"/>
  <rect x="136" y="95" width="28" height="46" rx="8" transform="rotate(-18 136 95)" fill="#071B33"/>
  <path d="M42 212l-8 110M91 212l12 110" stroke="#071B33" stroke-width="22" stroke-linecap="round"/>
</g>
<!-- rider -->
<g transform="translate(430 218)">
  <circle cx="74" cy="42" r="27" fill="#8B5A3C"/>
  <path d="M49 42c0-29 44-40 59-15 6 10 6 22 2 33-20-10-41-11-61-18z" fill="#202020"/>
  <rect x="45" y="70" width="74" height="93" rx="28" fill="url(#greenGrad)"/>
  <rect x="92" y="75" width="70" height="54" rx="12" fill="#007D3D"/>
  <rect x="105" y="87" width="44" height="30" rx="6" fill="#FFFFFF"/>
  <path d="M128 87v12l-8-5-8 5V87" fill="#00A651"/>
  <circle cx="52" cy="211" r="34" fill="#071B33"/>
  <circle cx="174" cy="211" r="34" fill="#071B33"/>
  <path d="M54 208h84l-32-48H76z" fill="none" stroke="#007D3D" stroke-width="12" stroke-linejoin="round"/>
  <path d="M119 161l52 9" stroke="#007D3D" stroke-width="12" stroke-linecap="round"/>
  <path d="M57 91l-30 56 41 17" stroke="#8B5A3C" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- floating groceries -->
<g filter="url(#shadow)">
  <rect x="308" y="352" width="104" height="78" rx="16" fill="#FFFFFF"/>
  <path d="M328 371h64l-8 42h-48z" fill="#00A651"/>
  <path d="M341 370c0-22 27-22 27 0" fill="none" stroke="#007D3D" stroke-width="8"/>
  <circle cx="347" cy="392" r="8" fill="#FFC107"/>
  <circle cx="372" cy="389" r="9" fill="#E45C45"/>
</g>

</svg>