<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title">
<title id="title">Track every step</title>

<defs>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071B33" flood-opacity=".12"/>
  </filter>
  <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34C76F"/>
    <stop offset="1" stop-color="#007D3D"/>
  </linearGradient>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DFF4FF"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
</defs>

<rect width="720" height="520" rx="36" fill="#F8FBF9"/>
<path d="M0 420c130-66 273-52 410 2s229 61 310 24v74H0z" fill="#E8F8EF"/>
